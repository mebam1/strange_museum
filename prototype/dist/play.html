<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3733">
  <title>이상한 박물관 · 전시 운영실</title>
  <link rel="icon" href="data:,">
  <style>
:root {
  color-scheme: light;
  --ink: #253630;
  --sub: #626d62;
  --paper: #f4f2e9;
  --card: #fffef8;
  --green: #23483d;
  --deep: #1b3733;
  --line: #cdd0bf;
  --orange: #a53d21;
  --ochre: #bc9459;
  --mono: "Consolas","Courier New",monospace;
  font-family: "Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
  color: var(--ink);
  background: var(--paper);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: default;
}

button:focus-visible,summary:focus-visible,.map:focus-visible {
  outline: 3px solid #cd7b3a;
  outline-offset: 2px;
}

button:not(:disabled):active {
  transform: translateY(1px);
}

p,h1,h2,h3,h4,ol,ul {
  margin: 0;
}

button {
  border: 0;
  background: none;
}

i[data-icon],span[data-icon] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 19px;
  height: 19px;
  font-style: normal;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

[hidden] {
  display: none!important;
}

.mast {
  background: var(--deep);
  color: #f5f1df;
  border-bottom: 4px solid #c99c62;
}

.mast-inner,main {
  width: min(1376px,100%);
  margin: 0 auto;
  padding: 0 clamp(18px,4vw,70px);
}

.mast-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 65px;
}

.brand,.mast nav,.mast nav button,.section-head>div,.title-actions,.title-actions>div,.inline-actions,.score-tag,.stat,.section-head,.map-foot,.detail-title,.section-title,.topline,.small-caption {
  display: flex;
  align-items: center;
}

.brand {
  gap: 12px;
}

.brand strong {
  font: 700 22px/1.2 "Batang","Noto Serif KR",Georgia,serif;
  letter-spacing: -.055em;
}

.brand .brandmark {
  width: 35px;
  height: 35px;
  border: 1px solid #ddc996;
  color: #e9d9a6;
  border-radius: 4px;
  padding: 5px;
}

.mast nav {
  gap: 8px;
}

.mast nav button {
  color: #f2f1dc;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 11px;
  gap: 7px;
  border: 1px solid #647468;
  border-radius: 4px;
}

.mast nav button:hover {
  background: #365447;
}

.mast nav i {
  width: 15px;
  height: 15px;
}

.headline {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  padding: 35px 0 24px;
}

.topline {
  gap: 8px;
  color: var(--orange);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .07em;
}

.topline:before {
  content: "";
  height: 2px;
  width: 23px;
  background: #b25732;
}

.headline h1 {
  font-family: "Batang","Noto Serif KR",Georgia,serif;
  font-weight: 700;
  font-size: clamp(31px,4vw,49px);
  line-height: 1.25;
  letter-spacing: -.075em;
  margin: 7px 0;
}

.headline p {
  font-size: 14px;
  color: var(--sub);
  line-height: 1.65;
  word-break: keep-all;
}

.title-actions {
  gap: 10px;
  align-self: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid #b9c0ae;
  border-radius: 4px;
  background: #fffef8;
  min-height: 38px;
}

.btn:hover:not(:disabled) {
  background: #eaece0;
  border-color: #839581;
}

.btn.primary {
  background: var(--orange);
  color: #fffaf0;
  border-color: var(--orange);
}

.btn.primary:hover:not(:disabled) {
  background: #862e19;
}

.btn.green {
  background: var(--green);
  color: white;
  border-color: var(--green);
}

.btn.green:hover:not(:disabled) {
  background: #15382e;
}

.btn.large {
  min-height: 46px;
  padding: 10px 20px;
  gap: 18px;
}

.btn.small {
  font-size: 12px;
  padding: 5px 10px;
  min-height: 30px;
}

.text-btn {
  font-size: 12px;
  color: var(--sub);
  padding: 6px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.inline-actions {
  flex-wrap: wrap;
  gap: 8px;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0,1.85fr) minmax(290px,1fr);
  gap: 18px;
  align-items: start;
}

.main-column,.side-column {
  min-width: 0;
  display: grid;
  gap: 16px;
  align-content: start;
}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 0 #283d2d08;
}

.section-head {
  min-height: 52px;
  padding: 12px 18px;
  justify-content: space-between;
  gap: 10px;
}

.section-head>div,.section-title {
  gap: 9px;
}

.section-head i,.section-title i {
  color: #617963;
  width: 17px;
  height: 17px;
}

h2 {
  font-size: 17px;
  letter-spacing: -.05em;
  line-height: 1.4;
}

h3 {
  font-size: 15px;
  letter-spacing: -.045em;
}

h4 {
  font-size: 13px;
}

.quiet {
  font-size: 12px;
  color: var(--sub);
}

.small-caption {
  gap: 6px;
  color: var(--sub);
  font-size: 12px;
  font-weight: 650;
}

.rules-copy,.detail-copy,.muted {
  font-size: 13px;
  line-height: 1.65;
  color: var(--sub);
  word-break: keep-all;
}

.map-shell {
  position: relative;
  background: #e9eadb;
}

.map {
  position: relative;
  overflow: hidden;
  height: clamp(235px,29vh,335px);
  touch-action: none;
  user-select: none;
  cursor: grab;
  border-top: 1px solid #c0c7b5;
  border-bottom: 1px solid #c0c7b5;
  background-color: #e8ebda;
  background-image: linear-gradient(to right,#afbaa4 1px,transparent 1px),linear-gradient(to bottom,#afbaa4 1px,transparent 1px),radial-gradient(#bec7b0 .85px,transparent .85px);
  background-size: var(--grid,78px) var(--grid,78px),var(--grid,78px) var(--grid,78px),10px 10px;
  background-position: var(--ox) var(--oy),var(--ox) var(--oy),var(--ox) var(--oy);
}

.map:active {
  cursor: grabbing;
}

.map-controls,.coordinate {
  position: absolute;
  z-index: 5;
  background: #f9faebeb;
  border: 1px solid #b8c3ad;
  border-radius: 4px;
  bottom: 11px;
}

.map-controls {
  right: 11px;
  display: flex;
  overflow: hidden;
}

.map-controls button {
  height: 31px;
  width: 33px;
  font: 18px/1 var(--mono);
  display: grid;
  place-items: center;
}

.map-controls button+button {
  border-left: 1px solid #cad0bd;
}

.map-controls button:hover {
  background: #dae2cd;
}

.map-controls i {
  width: 15px;
  height: 15px;
}

.coordinate {
  left: 12px;
  font: 10px var(--mono);
  padding: 4px 7px;
  color: #66775d;
  pointer-events: none;
}

.coordinate:empty {
  display: none;
}

.map-foot {
  flex-wrap: wrap;
  gap: 14px;
  padding: 10px 17px;
  color: var(--sub);
  font-size: 11px;
}

.map-foot span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.map-foot small {
  margin-left: auto;
  font-size: 11px;
}

.key {
  width: 10px;
  height: 10px;
  display: inline-block;
  border: 1px solid #7e9079;
}

.key.owned {
  background: #b5c6a6;
}

.key.open {
  border-style: dashed;
}

.key.token {
  width: 9px;
  height: 9px;
  border: 1px solid #a67733;
  background: #eccc83;
  transform: rotate(45deg);
}

.tile,.map-mark {
  position: absolute;
  width: var(--cell);
  height: var(--cell);
}

.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 2px;
  z-index: 2;
  border: 3px solid transparent;
  background-clip: padding-box;
  border-radius: 7px;
}

.tile.artifact {
  color: #29463c;
  background-color: #f9f3d9;
  box-shadow: inset 0 0 0 1.5px #75866a,inset 0 -5px 0 #c7ccb3;
}

.tile.artifact:before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid #bac2a7;
  border-radius: 2px;
  pointer-events: none;
}

.tile .tile-icon {
  width: 46%;
  height: 46%;
}

.tile-name {
  font-size: clamp(9px,calc(var(--cell) * .16),15px);
  line-height: 1.3;
  font-weight: 750;
  letter-spacing: -.06em;
  white-space: nowrap;
  max-width: 99%;
  overflow: hidden;
}

.tile.vacant {
  background-color: #d8e2cc;
  color: #697c62;
  box-shadow: inset 0 0 0 1.3px #84997b;
}

.empty-plus {
  font: 25px/1 var(--mono);
  color: #7b8e73;
}

.tile.token-cell {
  background: radial-gradient(ellipse at center,#fae3a5 47%,transparent 49%);
  color: #755621;
}

.facing {
  position: absolute;
  right: 5px;
  top: 4px;
  color: var(--orange);
  font-size: 12px;
}

.tile:hover {
  filter: brightness(1.04);
}

.small-tiles .tile-name,.tiny-tiles .tile-icon {
  display: none;
}

.tiny-tiles .tile {
  border: 0;
  border-radius: 0;
}

.tiny-tiles .empty-plus {
  font-size: 0;
}

#marks {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.map-mark {
  box-shadow: inset 0 0 0 2px var(--orange);
  border-radius: 4px;
}

.map-mark.target {
  background: #dcb56555;
  box-shadow: inset 0 0 0 2px #ab842e;
}

.map-mark.forecast {
  box-shadow: inset 0 0 0 3px #3a8770;
  background: #7abfa222;
}

.map-mark.place {
  border: 2px dashed #9c4726;
  background: #eac48555;
  box-shadow: none;
}

.map-mark.flash {
  background: #ffcc547a;
  box-shadow: inset 0 0 0 3px #c28d28;
}

.axis-x,.axis-y {
  position: absolute;
  font: 10px/1 var(--mono);
  color: #687a61;
  pointer-events: none;
}

.axis-x {
  top: 6px;
  transform: translateX(-50%);
}

.axis-y {
  left: 7px;
  transform: translateY(-50%);
}

#board-detail:not(:empty) {
  padding: 12px 17px;
  border-top: 1px solid #d7dacb;
  background: #f8f8ed;
}

.detail-title {
  gap: 8px;
  margin-bottom: 3px;
}

.detail-title small {
  font: 11px var(--mono);
  color: var(--sub);
}

#board-detail .inline-actions {
  margin-top: 6px;
}

.inventory {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  padding: 16px 2px;
  background: #eeefe2;
  border: 1px solid #c6cbb9;
  border-radius: 7px;
}

.stat {
  padding: 0 8px;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
}

.stat+.stat {
  border-left: 1px solid #c8cebc;
}

.stat strong {
  font: 700 24px/1.1 var(--mono);
  color: var(--green);
}

.stat strong small {
  font: 12px "Malgun Gothic",sans-serif;
  margin-left: 2px;
}

.stat span {
  font-size: 11px;
  color: #576554;
}

.starter-cards,.offers {
  padding: 0 17px 16px;
  display: grid;
  gap: 8px;
}

.starter-cards {
  grid-template-columns: repeat(2,minmax(0,1fr));
}

.item-card {
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #d1d5c5;
  border-radius: 5px;
  background: #fafaf0;
}

.item-card:hover:not(:disabled),.item-card.chosen {
  border-color: #81967d;
  background: #eff2e4;
}

.icon-well {
  width: 42px;
  height: 42px;
  background: #e9e9d4;
  border: 1px solid #d2d6c0;
  color: #435d47;
  display: grid;
  place-items: center;
  border-radius: 5px;
  flex-shrink: 0;
}

.icon-well i {
  width: 29px;
  height: 29px;
}

.item-card .item-text {
  flex: 1;
  min-width: 0;
}

.item-card strong {
  font-size: 14px;
  display: block;
}

.item-card small {
  display: block;
  font-size: 11px;
  line-height: 1.6;
  color: var(--sub);
  word-break: keep-all;
}

.price {
  font: 700 13px var(--mono);
  white-space: nowrap;
  color: var(--orange);
}

.empty-offer {
  padding: 9px 12px;
  color: var(--sub);
  font-size: 12px;
}

.intro-note {
  padding: 0 17px 15px;
}

.schedule {
  list-style: none;
  padding: 0 16px 12px;
}

.schedule li {
  display: grid;
  grid-template-columns: 34px 1fr;
  column-gap: 9px;
  align-items: start;
  border-top: 1px solid #dde0d1;
  padding: 9px 0;
}

.week-no {
  padding: 4px 0;
  color: #6e7867;
  font: 12px var(--mono);
  white-space: nowrap;
}

.schedule strong {
  font-size: 13px;
}

.schedule p {
  margin: 3px 0 0;
  font-size: 11px;
  line-height: 1.55;
  color: var(--sub);
  word-break: keep-all;
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 3px;
  background: #e9eddf;
  color: #526950;
  margin-left: 6px;
  font-weight: 700;
}

.tier-1 {
  background: #f1e6ca;
  color: #856626;
}

.tier-2 {
  background: #f5dace;
  color: #984426;
}

.score-panel {
  background: #254b3f;
  color: #faf7e8;
  border-color: #254b3f;
}

.score-panel .section-head i,.score-panel .quiet {
  color: #d6e0cd;
}

.score-main {
  padding: 0 18px 16px;
}

.score-number {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.score-number b {
  font: 700 50px/1.15 var(--mono);
  letter-spacing: -.07em;
}

.score-number span {
  font-size: 13px;
  color: #dde3d3;
}

.progress {
  height: 6px;
  border-radius: 3px;
  margin: 12px 0 9px;
  background: #536e5a;
  overflow: hidden;
}

.progress i {
  display: block;
  background: #edc07d;
  height: 100%;
}

.score-breakdown {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 13px;
  font-size: 11px;
  color: #dbe4d5;
}

.score-breakdown b {
  color: white;
  font-family: var(--mono);
}

.preview-body,.panel-body {
  padding: 0 17px 16px;
}

.preview-body strong {
  font-size: 14px;
}

.preview-body p+p {
  margin-top: 6px;
}

.preview-score {
  font: 700 20px var(--mono);
  color: var(--orange);
}

.preview-list {
  padding: 7px 0 0 19px;
  font-size: 12px;
  color: var(--sub);
  line-height: 1.8;
}

.warning,.boss-note {
  padding: 9px 11px;
  border-left: 3px solid #ba6843;
  background: #f7eadc;
  color: #784127;
  font-size: 12px;
  line-height: 1.65;
  margin-top: 7px;
  word-break: keep-all;
}

.boss-note {
  margin: 0 17px 15px;
}

.boss-note strong {
  display: block;
}

.result-row {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding: 9px 0;
  font-size: 13px;
  gap: 10px;
}

.tray {
  padding: 0 17px 15px;
}

.dice-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 5px 0 13px;
}

.die {
  display: grid;
  place-items: center;
  position: relative;
  width: clamp(40px,4.4vw,55px);
  height: clamp(40px,4.4vw,55px);
  padding: 8px;
  border-radius: 8px;
  border: 1.5px solid #7c8873;
  background: #f9f8eb;
  box-shadow: 0 3px 0 #c3c7b3;
  color: #334c3d;
}

.die[aria-pressed=true] {
  border: 2px solid #a2482c;
  background: #f6d9b8;
  color: #903f25;
  box-shadow: 0 3px 0 #ca9872;
}

.pips {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  grid-template-rows: repeat(3,1fr);
  gap: 1.5px;
}

.pips b {
  border-radius: 50%;
  background: currentColor;
}

.consumed {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 11px;
  color: var(--sub);
  padding-bottom: 10px;
}

.mini-die {
  border: 1px solid #c6ccbc;
  border-radius: 3px;
  padding: 2px 5px;
  background: #eeefe5;
  font-family: var(--mono);
}

.action-line {
  border-top: 1px solid #d4d8c7;
  padding-top: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.action-line .text-btn:last-child {
  margin-left: auto;
}

.button-note {
  font-size: 12px;
  color: var(--sub);
  margin: 8px 0;
}

.trace-line {
  padding: 0 17px 13px;
  font-size: 13px;
  line-height: 1.7;
}

.log-list {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.85;
  padding-left: 22px;
}

.report-body {
  padding: 0 17px 16px;
}

.report-body summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--sub);
}

.alert-block {
  padding: 12px 17px;
  background: #f7eadb;
  border-top: 1px solid #d7c8a9;
}

.hint-block {
  margin: 0 17px 15px;
  border: 1px solid #d3d6c4;
  border-radius: 4px;
  padding: 9px 11px;
}

.reward-grid {
  display: grid;
  gap: 7px;
}

.subsection {
  font-size: 13px;
  margin: 8px 0;
}

.shop-hint {
  padding: 0 17px 12px;
}

.schedule-button {
  width: 100%;
  text-align: left;
}

footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 28px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  color: var(--sub);
  font-size: 11px;
}

footer button {
  color: var(--sub);
  text-decoration: underline;
  padding: 4px 0;
}

dialog {
  width: min(530px,calc(100% - 28px));
  max-height: 84dvh;
  overflow: auto;
  background: var(--card);
  color: var(--ink);
  border: 1px solid #8a9989;
  padding: 0;
  border-radius: 9px;
  box-shadow: 0 18px 80px #15281b40;
}

dialog::backdrop {
  background: #192a25a3;
}

.dialog-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 17px;
  background: #f5f5e9;
  border-bottom: 1px solid var(--line);
}

.dialog-head button {
  font-size: 24px;
}

.dialog-copy {
  padding: 18px;
  font-size: 14px;
  line-height: 1.75;
}

.dialog-copy h3 {
  margin-top: 12px;
}

.dialog-copy p+p {
  margin-top: 8px;
}

.dialog-copy .inline-actions {
  margin-top: 14px;
}

#feedback {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  background: #253c33;
  color: white;
  padding: 9px 15px;
  font-size: 13px;
  line-height: 1.5;
  border-radius: 5px;
  box-shadow: 0 2px 10px #0002;
  z-index: 10;
  max-width: min(95vw,620px);

  const {CONFIG, RELICS, TOKENS, PATTERNS} = catalog;
  const directions = [[0, -1], [1, 0], [0, 1], [-1, 0]];

    bits = Math.imul(bits ^ (bits >>> 15), bits | 1);

  // the entire multiset, so extra dice can never match a smaller pattern.
  const compiled = new Map();
  function conditionTest(clause) {
    if (!clause) return () => true;
    const compact = clause.replace(/\s/g, "");
    const comparison = /^([a-z](?:\+[a-z])*)(<=|>=|=|<|>)(\d+)$/.exec(compact);

      if (--item.charges === 0) {

        this.log("removeRelic", RELICS[item.id].name + " 충전 소진", {pos, id: item.id});
      }
    }
    score(stat, amount, context) {
      if (!amount) return false;
      const before = this.view[stat];
      this.view[stat] += amount;
      this.log("score", (stat === "sum" ? "합 " : "배율 ") + (amount > 0 ? "+" : "") + amount,
        {pos: context.pos, stat, amount});
      for (const pos of this.order) {
        const item = this.board.relics[pos];
        if (!item) continue;
        const {trigger} = RELICS[item.id];
        if (trigger.on !== "threshold" || trigger.stat !== stat) continue;
        const key = stat + ":" + trigger.limit;
        if (before <= trigger.limit && this.view[stat] > trigger.limit && !this.view.thresholds.includes(key)) {
          this.view.thresholds.push(key);
          this.queue.push({on: "threshold", stat, limit: trigger.limit, causes: context.causes});
        }
      }
      return true;
    }
    create(pos, token, causes) {
      if (this.board.relics[pos] || this.board.tokens[pos]) return false;
      this.board.tokens[pos] = token;
      this.log("create", TOKENS[token].name + " 생성", {pos, id: token});
      this.queue.push({on: "tokenCreated", pos, token, causes});
      return true;
    }
    destroy(pos, token, context, perToken) {
      delete this.board.tokens[pos];
      this.log("destroy", TOKENS[token].name + " 파괴", {pos, id: token});
      this.queue.push({on: "tokenDestroyed", pos, token, causes: context.causes});
      this.apply(TOKENS[token].onDestroyed, {...context, pos, item: null});
      if (perToken) this.apply(perToken, context);
    }
    apply(effects, context) {
      let changed = false;
      for (const effect of effects) {
        const {pos, item, causes, bindings} = context;
        const amount = bindings[effect.amount] ?? effect.amount;
        switch (effect.type) {
          case "addSum":
          case "addMult":
            changed = this.score(effect.type === "addSum" ? "sum" : "mult", amount, context) || changed;
            break;
          case "gainReroll":
            this.view.rerollsLeft += amount;
            this.log("gainReroll", "리롤 +" + amount, {pos, amount});
            changed ||= !!amount;
            break;
          case "createToken":
            for (const dest of targets(this.board, pos, effect.scope, item?.facing)) {
              changed = this.create(dest, effect.token, causes) || changed;
            }
            break;
          case "destroyTokens":
            context.destroyed = 0;
            context.targetToken = effect.token;
            for (const dest of targets(this.board, pos, effect.scope, item?.facing)) {
              const token = this.board.tokens[dest];
              if (!token || (effect.token && token !== effect.token)) continue;
              if (effect.tag && !TOKENS[token].tags.includes(effect.tag)) continue;
              this.destroy(dest, token, context, effect.perToken);
              context.destroyed++;
              changed = true;
            }
            break;
          case "transformTokens":
            for (const dest of targets(this.board, pos, effect.scope, item?.facing)) {
              if (this.board.tokens[dest] !== effect.from) continue;
              this.board.tokens[dest] = effect.to;
              this.log("transform", TOKENS[effect.from].name + " → " + TOKENS[effect.to].name,
                {pos: dest, id: effect.to, from: effect.from});
              this.queue.push({on: "tokenTransformed", pos: dest, from: effect.from, token: effect.to, causes});
              changed = true;
            }
            break;
          case "grantDieIfDestroyed":
            if (context.destroyed >= effect.required) {
              this.game.dice.push(newDie(this.game));
              delete this.board.relics[pos];
              this.log("grantDie", "주사위 +1 · 다음 관람부터 사용", {pos, id: item.id});
              this.log("removeRelic", RELICS[item.id].name + " 소진", {pos, id: item.id});
              changed = true;
            } else {
              const name = TOKENS[context.targetToken]?.name || "토큰";
              this.log("warning", name + " " + context.destroyed + "개가 파괴되고 주사위는 얻지 못합니다.",
                {pos, id: item.id, count: context.destroyed, token: context.targetToken, required: effect.required});
            }
            break;
          case "changeFace":
            this.deferred.push({pos, item, value: bindings[effect.value] ?? effect.value});
            break;
          default:
            throw new Error("알 수 없는 효과 " + effect.type);
        }
      }
      return changed;
    }
    expire(lifetime) {
      const positions = Object.keys(this.board.tokens).sort(comparePos);
      for (const pos of positions) {
        const token = this.board.tokens[pos];
        if (TOKENS[token]?.lifetime !== lifetime) continue;
        this.log("vanish", TOKENS[token].name + " 소멸", {pos, id: token});
        delete this.board.tokens[pos];
        this.apply(TOKENS[token].onVanish, {pos, item: null, bindings: {}, causes: new Set()});
        this.drain();
      }
    }
    changeFaces() {
      for (const {pos, item, value} of this.deferred) {
        if (this.board.relics[pos] !== item) continue;
        const candidates = this.view.remaining.filter(die => valueOf(this.game, die) !== value);
        if (!candidates.length) continue;
        const choice = candidates[randomInt(this.game, candidates.length)];
        const die = this.game.dice.find(candidate => candidate.id === choice.id);
        const old = die.faces[choice.face];
        die.faces[choice.face] = value;
        this.log("changeFace", "주사위 면 " + old + " → " + value, {pos, id: item.id, die: die.id, old, value});
        this.spendCharge(pos, item);
      }
    }
  }

  function submitEffects(game, values, {sealed = false} = {}) {
    const wave = new Resolution(game);
    if (!sealed) {
      const key = [...values].sort().join("");
      const patterns = new Set(wave.order.map(pos => RELICS[game.board.relics[pos].id].trigger.pattern).filter(Boolean));
      // Display exact catalogue matches even if this museum owns no listener.
      for (const pattern of Object.keys(PATTERNS)) patterns.add(pattern);
      const events = new Map();
      for (const pattern of patterns) {
        const bindings = matchKey(pattern, key);
        if (!bindings) continue;
        const event = {on: "submit", pattern, bindings};
        events.set(pattern, event);
        wave.log("pattern", PATTERNS[pattern] || pattern, {pattern, bindings});
        if (wave.limit()) break;
      }
      // Distinct patterns share a root. Interleave their listeners in board
      // order before processing the child events generated by any listener.
      for (const pos of wave.order) {
        const item = game.board.relics[pos];
        const event = item && events.get(RELICS[item.id].trigger.pattern);
        if (event) wave.react(pos, event);
      }
      wave.drain();
    }
    wave.expire("submission");
    wave.changeFaces();
    return wave.trace;
  }
  function resolveEvent(game, event) {
    const wave = new Resolution(game);
    wave.queue.push(event);
    wave.drain();
    wave.changeFaces();
    return wave.trace;
  }
  function rerollEffects(game, count) {
    return resolveEvent(game, {on: "reroll", count});
  }
  function createExternalToken(game, pos, id) {
    const wave = new Resolution(game);
    wave.create(pos, id, new Set());
    wave.drain();
    wave.changeFaces();
    return wave.trace;
  }
  function endEffects(game) {
    const wave = new Resolution(game);
    wave.expire("viewing");
    wave.changeFaces();
    return wave.trace;
  }
  function projectedScore(game) {
    const {sum, mult} = game.view;
    if (!Object.values(game.board.tokens).some(id => TOKENS[id].lifetime === "viewing")) {
      return {tokenSum: 0, score: sum * (1 + mult)};
    }
    // A token can cross the critic's threshold at closing. Simulate the same
    // expiry on an isolated rules state so the estimate includes that response.
    const shadow = JSON.parse(JSON.stringify({board: game.board, dice: game.dice, rng: game.rng,
      nextDieId: game.nextDieId, view: {sum, mult, thresholds: game.view.thresholds,
        remaining: game.view.remaining, rerollsLeft: game.view.rerollsLeft}}));
    endEffects(shadow);
    return {tokenSum: shadow.view.sum - sum, score: shadow.view.sum * (1 + shadow.view.mult)};
  }

  const api = {...catalog, random, randomInt, newDie, instance, matchPattern, submitEffects, rerollEffects,
    endEffects, projectedScore, targets, comparePos, valueOf, resolveEvent, createExternalToken};
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.MuseumCore = api;
})(globalThis);

  <script>
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./core.js'));
  else root.MuseumGame = factory(root.MuseumCore);
})(globalThis, function (Core) {
  'use strict';

  const C = Core.CONFIG;
  const RULES_VERSION = C.rulesVersion;
  const SAVE_KEY = 'strange-museum-v12-run-v5';
  const bossNames = { steady: '꾸준함', burst: '한 방', diversity: '눈의 다양성' };
  const strengthNames = ['약', '중', '강'];
  const copy = value => JSON.parse(JSON.stringify(value));
  const money = value => Math.round(value * 10) / 10;
  const choose = (game, entries) => entries[Core.randomInt(game, entries.length)];
  const belowCap = (count, cap) => cap == null || count < cap;

  function seedNumber(seed) {
    if (Number.isFinite(seed)) return Math.trunc(seed) >>> 0;
    let hash = 2166136261;
    for (const ch of String(seed)) hash = Math.imul(hash ^ ch.codePointAt(0), 16777619);
    return hash >>> 0;
  }

  function bossEntry(week, type) {
    const [weakThrough, mediumThrough] = C.boss.strengthWeeks;
    const tier = week <= weakThrough ? 0 : week <= mediumThrough ? 1 : 2;
    let rule;
    if (type === 'steady') {
      const cap = C.boss.steady.caps[tier];
      const damage = tier === 0 ? '남은 주사위 1개를 이번 관람에서 제외합니다.' : '주사위 1개를 영구히 잃습니다.';
      rule = `한 번의 제출로 합 +${week * C.boss.steady.perWeek} 또는 배율 +1을 얻어야 합니다. 미달하면 ${damage}${cap == null ? '' : ' 최대 ' + cap + '회.'}`;
    } else if (type === 'burst') {
      const b = C.boss.burst;
      const mult = b.mult[tier] ? `, 배율 −${b.mult[tier]}` : '';
      const cap = b.dustCaps[tier];
      const dust = cap === 0 ? '' : ` 유물 곁에 먼지가 쌓입니다.${cap == null ? '' : ' 최대 ' + cap + '개.'}`;
      rule = `${b.free[tier] + 1}번째 제출부터 매번 합 −${b.sum[tier]}${mult}.${dust}`;
    } else {
      const cap = C.boss.diversity.caps[tier];
      rule = '전체 주사위의 면에 가장 많은 눈을 봉인합니다(동률이면 큰 눈). 그 눈을 내면 모든 패턴이 무효입니다.';
      if (cap !== 0) rule += ` 함께 낸 봉인된 면 하나가 영구히 바뀝니다.${cap == null ? '' : ' 최대 ' + cap + '회.'}`;
    }
    return { week, type, tier, strength: strengthNames[tier], name: bossNames[type], rule };
  }

  function newGame(seed = Date.now()) {
    const game = {
      rulesVersion: RULES_VERSION, seed, rng: seedNumber(seed), phase: 'intro', week: 1, visitor: 1,
      money: C.startMoney, dice: [], nextDieId: 1, schedule: [], view: null, shop: null,
      lastResult: null, history: [], board: { cells: [...C.startCells], relics: {}, tokens: {} }
    };
    for (const [pos, id] of Object.entries(C.startRelics)) game.board.relics[pos] = Core.instance(id);
    for (let i = 0; i < C.startDice; i++) game.dice.push(Core.newDie(game));
    let previous;
    for (let week = 1; week <= C.weeks; week++) {
      const type = choose(game, Object.keys(bossNames).filter(id => id !== previous));
      game.schedule.push(bossEntry(week, type));
      previous = type;
    }
    return game;
  }

  function drawStock(game, ids) {
    const pool = [...ids], drawn = [];
    while (drawn.length < C.slots && pool.length) drawn.push(pool.splice(Core.randomInt(game, pool.length), 1)[0]);
    return drawn;
  }

  function rewardChoices(game) {
    const catalog = Object.values(Core.RELICS);
    const choices = drawStock(game, catalog.filter(r => r.kind === 'normal').map(r => r.id));
    if (Core.random(game) < C.rewardDiceChance) {
      choices[Core.randomInt(game, choices.length)] = choose(game, catalog.filter(r => r.kind === 'dice')).id;
    }
    return choices;
  }

  function sealedValue(game) {
    const counts = new Map(C.fairFaces.map(value => [value, 0]));
    for (const die of game.dice) for (const face of die.faces) counts.set(face, counts.get(face) + 1);
    return [...counts].sort((a, b) => b[1] - a[1] || b[0] - a[0])[0][0];
  }

  function startViewing(game) {
    if (game.phase !== 'intro' && game.phase !== 'shop') return false;
    if (game.phase === 'shop') {
      game.visitor = game.visitor % C.visitorsPerWeek + 1;
      if (game.visitor === 1) game.week++;
    }
    const boss = game.visitor === C.visitorsPerWeek ? game.schedule[game.week - 1] : null;
    game.phase = 'viewing';
    game.shop = null;
    game.view = {
      remaining: game.dice.map(die => ({ id: die.id, face: Core.randomInt(game, die.faces.length) })),
      submitted: [], removed: [], sum: 0, mult: 0, rerollsLeft: C.rerolls, thresholds: [],
      rewards: rewardChoices(game), target: C.baseTarget[boss ? 'boss' : 'normal'] * C.weekMultipliers[game.week - 1],
      boss, sealedFace: boss && boss.type === 'diversity' ? sealedValue(game) : null,
      submissions: 0, damage: [], penaltyCount: 0, dustCount: 0
    };
    return true;
  }

  function selected(game, ids) {
    if (game.phase !== 'viewing' || !Array.isArray(ids) || !ids.length) return [];
    const keys = new Set(ids);
    if (keys.size !== ids.length) return [];
    const entries = game.view.remaining.filter(entry => keys.has(entry.id));
    return entries.length === keys.size ? entries : [];
  }

  function reroll(game, ids) {
    const entries = selected(game, ids);
    if (!entries.length || game.view.rerollsLeft <= 0) return [];
    game.view.rerollsLeft--;
    for (const entry of entries) {
      const die = game.dice.find(d => d.id === entry.id);
      entry.face = Core.randomInt(game, die.faces.length);
    }
    return [{ type: 'reroll', text: `주사위 ${entries.length}개를 다시 굴렸습니다.` }, ...Core.rerollEffects(game, entries.length)];
  }

  function recordDamage(view, trace, kind, text) {
    view.damage.push(text);
    trace.push({ type: 'boss', kind, text });
  }

  function steadyPenalty(game, oldSum, oldMult, trace) {
    const v = game.view, tier = v.boss.tier;
    if (v.sum - oldSum >= C.boss.steady.perWeek * game.week || v.mult > oldMult) return;
    if (!belowCap(v.penaltyCount, C.boss.steady.caps[tier])) return;
    if (tier === 0 ? !v.remaining.length : game.dice.length <= C.minimumDice) return;
    const chosen = choose(game, v.remaining.length ? v.remaining : game.dice);
    const remaining = v.remaining.find(entry => entry.id === chosen.id);
    if (remaining) v.removed.push({ id: chosen.id, value: Core.valueOf(game, remaining) });
    v.remaining = v.remaining.filter(entry => entry.id !== chosen.id);
    v.penaltyCount++;
    if (tier === 0) {
      recordDamage(v, trace, 'temporaryLoss', `주사위 #${chosen.id}을 이번 관람에서 제외했습니다.`);
    } else {
      game.dice = game.dice.filter(die => die.id !== chosen.id);
      recordDamage(v, trace, 'dieLost', `주사위 #${chosen.id}을 영구히 잃었습니다.`);
    }
  }

  function burstPenalty(game, trace) {
    const v = game.view, tier = v.boss.tier, b = C.boss.burst;
    if (v.submissions <= b.free[tier]) return;
    const sumLost = Math.min(v.sum, b.sum[tier]), multLost = Math.min(v.mult, b.mult[tier]);
    v.sum -= sumLost;
    v.mult -= multLost;
    if (sumLost || multLost) {
      const losses = [sumLost && `합 −${sumLost}`, multLost && `배율 −${multLost}`].filter(Boolean);
      recordDamage(v, trace, 'scoreLost', losses.join(', '));
    }
    if (!belowCap(v.dustCount, b.dustCaps[tier])) return;
    const neighbours = new Set();
    for (const source of Object.keys(game.board.relics)) {
      for (const pos of Core.targets(game.board, source, 'adjacent')) {
        if (!game.board.relics[pos] && !game.board.tokens[pos]) neighbours.add(pos);
      }
    }
    if (!neighbours.size) return;
    const pos = choose(game, [...neighbours].sort(Core.comparePos));
    v.dustCount++;
    recordDamage(v, trace, 'dust', `(${pos})에 먼지가 쌓였습니다.`);
    trace.push(...Core.createExternalToken(game, pos, 'dust'));
  }

  function diversityPenalty(game, blockedDice, trace) {
    const v = game.view, cap = C.boss.diversity.caps[v.boss.tier];
    recordDamage(v, trace, 'sealed', `봉인된 눈 ${v.sealedFace}을 내서 패턴이 무효가 되었습니다.`);
    if (!belowCap(v.penaltyCount, cap)) return;
    const chosen = choose(game, blockedDice);
    const die = game.dice.find(d => d.id === chosen.id);
    const replacement = choose(game, C.fairFaces.filter(n => n !== v.sealedFace));
    die.faces[chosen.face] = replacement;
    v.penaltyCount++;
    recordDamage(v, trace, 'faceChanged', `주사위 #${die.id}의 ${v.sealedFace} 면이 ${replacement}(으)로 바뀌었습니다.`);
  }

  function submit(game, ids) {
    const entries = selected(game, ids);
    if (!entries.length) return [];
    const v = game.view, selectedIds = new Set(ids);
    const values = entries.map(entry => Core.valueOf(game, entry));
    const blockedDice = entries.filter((_, index) => values[index] === v.sealedFace);
    const oldSum = v.sum, oldMult = v.mult;
    v.remaining = v.remaining.filter(entry => !selectedIds.has(entry.id));
    v.submitted.push(...entries.map((entry, i) => ({ id: entry.id, value: values[i] })));
    v.submissions++;
    const trace = [{ type: 'submit', text: `${values.join(' · ')} 제출` },
      ...Core.submitEffects(game, values, { sealed: blockedDice.length > 0 })];
    switch (v.boss && v.boss.type) {
      case 'steady': steadyPenalty(game, oldSum, oldMult, trace); break;
      case 'burst': burstPenalty(game, trace); break;
      case 'diversity': if (blockedDice.length) diversityPenalty(game, blockedDice, trace); break;
    }
    if (!v.remaining.length) trace.push(...endViewing(game));
    return trace;
  }

  function endViewing(game) {
    if (game.phase !== 'viewing') return [];
    const v = game.view;
    v.remaining = [];
    v.rerollsLeft = 0;
    const trace = Core.endEffects(game);
    const score = v.sum * (1 + v.mult), ratio = score / v.target;
    const tier = C.tipTiers.filter(t => ratio >= t.ratio).pop();
    const passed = score >= v.target;
    const result = {
      week: game.week, visitor: game.visitor, score, target: v.target, tip: tier.tip, grade: tier.name,
      passed, damage: [...v.damage], diceCount: game.dice.length
    };
    game.history.push(result);
    game.lastResult = result;
    game.money = money(game.money + tier.tip);
    if (v.boss && !passed) game.phase = 'lost';
    else if (v.boss && game.week === C.weeks) game.phase = 'won';
    else {
      game.phase = 'shop';
      game.shop = { stock: drawStock(game, Object.keys(Core.RELICS)), rewardDone: false };
    }
    trace.push({ type: 'end', text: `관람 종료 · 감동 ${score} · 팁 ${tier.tip}원` });
    return trace;
  }

  function projected(game) {
    if (game.phase === 'viewing') return Core.projectedScore(game);
    return { score: game.lastResult ? game.lastResult.score : 0, tokenSum: 0 };
  }

  function preview(game, ids) {
    // The history and stock of a simulated run never feed the rules for the current visitor.
    const scratch = { ...game, board: copy(game.board), dice: copy(game.dice), view: copy(game.view), history: [] };
    const trace = submit(scratch, ids);
    const byType = type => trace.filter(ev => ev.type === type).map(ev => ev.text);
    const count = kind => trace.filter(ev => ev.type === 'boss' && ev.kind === kind).length;
    return {
      ...projected(scratch), trace, patterns: byType('pattern'), warnings: byType('warning'),
      damage: byType('boss'), permanentLosses: count('dieLost'), permanentFaceChanges: count('faceChanged'),
      temporaryLosses: count('temporaryLoss'), newDust: count('dust')
    };
  }

  function cellPrice(game) {
    return C.cellPriceBase + C.cellPriceStep * (game.board.cells.length - C.startCells.length);
  }

  function validPos(pos) {
    if (typeof pos !== 'string') return false;
    const xy = pos.split(',').map(Number);
    return xy.length === 2 && xy.every(Number.isSafeInteger) && xy.join(',') === pos;
  }

  function buyCell(game, pos) {
    if (game.phase !== 'shop' || !validPos(pos) || game.board.cells.includes(pos)) return false;
    const price = cellPrice(game);
    if (game.money < price) return false;
    game.money = money(game.money - price);
    game.board.cells.push(pos);
    return true;
  }

  const emptyCell = (board, pos) => board.cells.includes(pos) && !board.relics[pos] && !board.tokens[pos];
  const validFacing = facing => Number.isInteger(facing) && facing >= 0 && facing < 4;

  function acquire(game, source, index, pos, facing = 0) {
    if (game.phase !== 'shop' || !Number.isInteger(index) || !validFacing(facing)) return false;
    if (!emptyCell(game.board, pos)) return false;
    const reward = source === 'reward';
    if (reward ? game.shop.rewardDone : source !== 'stock') return false;
    const id = (reward ? game.view.rewards : game.shop.stock)[index];
    const def = Core.RELICS[id];
    if (!def || (!reward && game.money < def.price)) return false;
    const item = Core.instance(id, def.facing ? facing : 0);
    if (reward) game.shop.rewardDone = true;
    else {
      game.shop.stock[index] = null;
      game.money = money(game.money - def.price);
    }
    game.board.relics[pos] = item;
    return true;
  }

  function declineReward(game) {
    if (game.phase !== 'shop' || game.shop.rewardDone) return false;
    game.shop.rewardDone = true;
    return true;
  }

  function moveRelic(game, from, to, facing) {
    if (game.phase !== 'shop' || !game.board.cells.includes(from)) return false;
    const item = game.board.relics[from];
    if (!item || (from !== to && !emptyCell(game.board, to))) return false;
    if (facing != null && !validFacing(facing)) return false;
    if (facing != null && Core.RELICS[item.id].facing) item.facing = facing;
    delete game.board.relics[from];

    if (game.phase !== 'viewing') throw new Error('관람 중에만 제출을 고를 수 있습니다.');
    const ids = game.view.remaining.map(die => die.id);
    const policy = Core.CONFIG.auto;
    const maxSize = ids.length > policy.fullEnumerationLimit ? policy.maxSubsetSize : ids.length;
    const baseline = Game.projected(game).score;
    let bestGain = 0;
    let best = null;
    const picked = [];

    function explore(start) {

          - result.permanentFaceChanges * policy.faceChangePenalty
          - result.newDust * policy.dustPenalty
          - (result.temporaryLosses || 0) * policy.temporaryLossPenalty
          - result.warnings.length * policy.warningPenalty;

  // Prefer early sources of token value, then multipliers and additional sources.
  function shopPreference(game) {
    const owned = Object.values(game.board.relics).map(relic => relic.id);
    const priorities = [];
    if (!owned.includes('banker')) priorities.push('banker');
    if (!owned.includes('critic')) priorities.push('critic');
    if (owned.includes('banker') && !owned.includes('die_coin')) priorities.push('die_coin');
    if (!owned.includes('collector')) priorities.push('collector');
    priorities.push('banker', 'lamp', 'guide', 'critic', 'dairy', 'collector', 'scribe',
      'firework', 'alchemist', 'fidget', 'die_coin', 'die_cheese', 'die_scroll',
      'archivist', 'thief', 'curator', 'carver', 'sweeper');
    return priorities;
  }

  function nextShopPosition(board) {
    const available = pos => !board.relics[pos] && !board.tokens[pos];
    const owned = board.cells.find(available);
    if (owned) return { pos: owned, needsCell: false };
    // Fill a checkerboard around the entrance, leaving orthogonal spaces for tokens.
    for (let radius = 0; ; radius += 2) {
      for (let y = -radius; y <= radius; y++) {
        const distance = radius - Math.abs(y);
        for (const x of distance ? [-distance, distance] : [0]) {

      .filter(offer => offer.id && cellCost + (source === 'reward' ? 0 : Core.RELICS[offer.id].price) <= game.money)

    if (game.phase === 'intro') {

    }

    const game = Game.newGame(seed);
    while (game.phase !== 'won' && game.phase !== 'lost') step(game);
    return game;
  }

  return { chooseAction, step, run };
});

  board.addEventListener('pointerup', event => {
    if (!drag || drag.id !== event.pointerId) return;
    const click = !drag.moved || drag.moveRelic;
    const rect = board.getBoundingClientRect();
    drag = null;
    if (click && event.clientX >= rect.left && event.clientX < rect.right &&
        event.clientY >= rect.top && event.clientY < rect.bottom) actions.select(position(event));
  });
  function release(event) { if (drag?.id === event.pointerId) drag = null; }
  board.addEventListener('pointercancel', release);
  board.addEventListener('lostpointercapture', release);
  board.addEventListener('pointerleave', event => { if (event.isPrimary && !drag) { hover = null; drawMarks(); } });
  board.addEventListener('click', event => {
    if (event.detail === 0 && event.target.closest('[data-pos]')) actions.select(event.target.closest('[data-pos]').dataset.pos);
  });
  board.addEventListener('keydown', event => {
    if (!model) return;
    const offsets = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowRight:[1,0], ArrowLeft:[-1,0]};
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); actions.select(hover || model.focus || '0,0'); }
    const delta = offsets[event.key];
    if (!delta) return;
    event.preventDefault();
    const from = xy(hover || model.focus || '0,0');
    const to = [safeCoordinate(from[0] + delta[0]), safeCoordinate(from[1] + delta[1])];
    aim(to.join(','), false);
    actions.focus(hover);
  });
  board.addEventListener('wheel', event => { event.preventDefault(); zoom(event.deltaY < 0 ? 1.15 : 1/1.15); }, {passive:false});
  board.addEventListener('dragover', event => {
    if (!model?.shop) return;
    event.preventDefault(); hover = position(event); drawMarks();
  });
  board.addEventListener('drop', event => {
    event.preventDefault();
    if (model?.held) actions.select(position(event));
  });
  new ResizeObserver(() => { if (autoFit) fit(); draw(); }).observe(board);
  window.MuseumBoard = {
    connect(handlers) { actions = handlers; },
    render(data) { model = data; if (autoFit) fit(); draw(); },
    aim, zoom, fit() { fit(); draw(); }
  };
})();

</script>
  <script>
(() => {
  'use strict';
  const C = MuseumCore, G = MuseumGame, P = MuseumPolicy, B = MuseumBoard;
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const icon = (name, color = false) => '<i data-icon="' + esc(name) + '"' + (color ? ' data-color' : '') + '></i>';

  const head = (name, symbol, right = '') => '<div class="section-head"><div>' + icon(symbol) + '<h2>' + name + '</h2></div>' + right + '</div>';
  const quiet = text => '<span class="quiet">' + text + '</span>';
  const panel = html => '<section class="panel">' + html + '</section>';
  const point = pos => '(' + esc(pos?.replace(',', ', ')) + ')';
  const terminal = () => game.phase === 'lost' || game.phase === 'won';
  let storage;
  try { storage = window.localStorage; } catch { /* The status line reports unavailable storage. */ }
  let game = G.load(storage), chosen = new Set(), focus = null, held = null, prediction = null;
  let lastTrace = [], animation = null, animationTimer, auto = '', autoTimer, messageTimer;
  function save() {
    $('save-status').textContent = G.save(storage, game) ? '●  자동 저장됨' : '자동 저장 불가 · 이 브라우저의 저장 권한을 확인하세요.';
  }
  function say(text) {
    clearTimeout(messageTimer);
    $('feedback').textContent = text;
    messageTimer = setTimeout(() => { $('feedback').textContent = ''; }, 2600);
  }
  function dialog(title, html) {
    $('dialog-title').textContent = title;
    $('dialog-body').innerHTML = html;
    MuseumSymbols.render($('dialog'));
    if (!$('dialog').open) $('dialog').showModal();
  }
  function schedule() {
    return '<ol class="schedule">' + game.schedule.map(b =>
      '<li><span class="week-no">' + b.week + '주</span><div><strong>' + esc(b.name) + '</strong><span class="badge tier-' + b.tier + '">' + esc(b.strength) + '</span><p>' + esc(b.rule) + '</p></div></li>'
    ).join('') + '</ol>';
  }
  function inventory() {
    const field = (name, n, unit) => '<div class="stat"><span>' + name + '</span><strong>' + n + '<small>' + unit + '</small></strong></div>';
    return '<div class="inventory">' + field('운영 자금', game.money, '원') + field('주사위', game.dice.length, '개') + field('소장 유물', Object.keys(game.board.relics).length, '점') + '</div>';
  }
  function itemCard(id, action, suffix = '', disabled = false) {
    if (!id) return '<div class="empty-offer">판매 완료</div>';
    const r = C.RELICS[id];
    const isOffer = action.startsWith('reward-') || action.startsWith('stock-');
    const active = held?.action === action;
    return '<button class="item-card' + (active ? ' chosen' : '') + '" data-action="' + action + '"' +
      (isOffer && !disabled ? ' draggable="true"' : '') + (disabled ? ' disabled' : '') + '><span class="icon-well">' + icon(id, true) +
      '</span><span class="item-text"><strong>' + r.name + '</strong><small>' + r.triggerText + ' · ' + r.effectText +
      '</small></span>' + (suffix ? '<span class="price">' + suffix + '</span>' : '') + '</button>';
  }
  function renderHeadline() {
    const v = game.view, phase = game.phase;
    const [title, desc] = phase === 'intro' ? ['개관 준비','여덟 주 동안 전시실을 운영하고, 매주 세 번째 관객의 평가를 통과하세요.'] :
      phase === 'viewing' ? [v.boss ? '평가 담당자 관람' : '일반 관객 관람', v.boss ? v.boss.name + ' 평가 · ' + v.boss.strength + ' 단계' : '주사위를 나눠 제출해 유물을 발동시키세요.'] :
      phase === 'shop' ? ['전시 정비','관람이 끝났습니다. 다음 관객이 오기 전에 유물을 고르고 전시실을 정비하세요.'] :
      phase === 'won' ? ['최종 평가 통과','여덟 주의 전시를 마쳤습니다.'] : ['전시 종료','이번 주 평가 담당자의 감동이 기준에 미치지 못했습니다.'];
    let actions = '';
    if (auto) actions = btn('stop','자동 진행 멈추기','large');
    else if (phase === 'intro') actions = btn('auto-run','런 자동 진행') + btn('start','첫 관객 맞이하기 ' + icon('arrow'),'primary large');
    else if (phase === 'shop') actions = btn('auto-run','런 자동 진행') + btn('start',(game.shop.rewardDone ? '다음 관객 맞이하기 ' : '무료 보상 건너뛰고 다음 관람 ') + icon('arrow'),'primary large');
    else if (phase === 'viewing') actions = inventory();
    else if (terminal()) actions = btn('new','새 전시 시작 ' + icon('arrow'),'primary large');
    $('headline').innerHTML = '<div><span class="topline">' + (phase === 'intro' ? '전시 운영실' : game.week + '주차 · 관객 ' + game.visitor + ' / ' + C.CONFIG.visitorsPerWeek) + '</span><h1>' + title + '</h1><p>' + desc + '</p></div><div class="title-actions">' + actions + '</div>';
  }
  function remainingGoal(id, pos) {
    const def = C.RELICS[id];
    if (def.kind !== 'dice') return '';
    const destroy = def.effects.find(e => e.type === 'destroyTokens'), grant = def.effects.find(e => e.type === 'grantDieIfDestroyed');
    const count = C.targets(game.board, pos, 'adjacent').filter(p => game.board.tokens[p] === destroy.token).length;
    return '인접 ' + C.TOKENS[destroy.token].name + ' ' + count + '/' + grant.required + '개';
  }
  function detail() {
    const el = $('board-detail');
    if (held) {
      const def = C.RELICS[held.id];
      const message = held.source === 'cell' ? '사려는 자리를 누르세요. 떨어진 자리도 구매할 수 있습니다.' :
        '구매한 빈칸을 눌러 배치하세요.' + (def.facing ? ' 현재 방향 ' + ['↑','→','↓','←'][held.facing] : '');
      el.innerHTML = '<div class="detail-title"><strong>' + (def?.name || '칸 구매 · ' + G.cellPrice(game) + '원') + '</strong></div><p class="detail-copy">' + message + '</p><div class="inline-actions">' +
        (def?.facing ? btn('rotate','회전 R','small') : '') + btn('cancel','취소 Esc','small') + '</div>';
    } else if (focus) {
      const inst = game.board.relics[focus], token = game.board.tokens[focus], owned = game.board.cells.includes(focus);
      const def = inst ? C.RELICS[inst.id] : C.TOKENS[token];
      const info = [def?.description || (owned ? '상점에서 유물을 놓을 수 있습니다.' : '상점에서 구매할 수 있는 자리입니다.')];
      if (inst?.charges != null) info.push('남은 충전 ' + inst.charges + '회');
      if (inst?.id && remainingGoal(inst.id,focus)) info.push(remainingGoal(inst.id,focus));
      if (token) info.push(owned ? '구매한 칸' : '미구매 자리');
      let actions = '';
      if (game.phase === 'shop') {
        if (inst) actions = btn('move','이동','small') + (def.facing ? btn('rotate','회전 R','small') : '') + btn('sell','판매 · ' + (Math.round(def.price * C.CONFIG.saleFraction * 10)/10) + '원','small');
        else if (!owned) actions = btn('buy-here','이 칸 구매 · ' + G.cellPrice(game) + '원','small',game.money < G.cellPrice(game));
      }
      el.innerHTML = '<div class="detail-title"><strong>' + (def?.name || (owned ? '구매한 빈칸' : '미구매 자리')) + '</strong><small>' + point(focus) + '</small></div><p class="detail-copy">' + info.join(' · ') + '</p>' + (actions ? '<div class="inline-actions">' + actions + '</div>' : '');
    } else { el.innerHTML = ''; }
  }
  function renderBoard() {
    const board = animation?.board || game.board;
    $('board-count').textContent = '구매한 칸 ' + game.board.cells.length + '개';
    B.render({board, focus, held, shop:game.phase === 'shop' && !auto, flash:animation?.pos,
      forecast:prediction?.trace.filter(ev => ev.pos && ['fire','create','destroy','vanish','transform'].includes(ev.type)).map(ev => ev.pos)});
    detail();
  }
  const pipPlaces = [[],[5],[1,9],[1,5,9],[1,3,7,9],[1,3,5,7,9],[1,3,4,6,7,9]];
  function pips(value) {
    return '<span class="pips" aria-hidden="true">' + pipPlaces[value].map(n => '<b style="grid-area:' + (Math.floor((n-1)/3)+1) + '/' + ((n-1)%3+1) + '"></b>').join('') + '</span>';
  }
  function diceTray() {
    const v = game.view;
    const dice = v.remaining.map(e => {
      const value = C.valueOf(game,e), faces = game.dice.find(d => d.id === e.id).faces.join(' · ');
      return '<button class="die" data-action="die-' + e.id + '" aria-pressed="' + chosen.has(e.id) + '" aria-label="주사위 ' + e.id + ', ' + value + ' 눈" title="#' + e.id + ' · 면 ' + faces + '"' + (auto ? ' disabled' : '') + '>' + pips(value) + '</button>';
    }).join('');
    const spent = entries => entries.map(e => '<span class="mini-die" title="주사위 ' + e.id + '">' + e.value + '</span>').join('');
    const mobilePrediction = prediction ? '<div class="mobile-prediction"><b>제출 후 감동 ' + prediction.score + ' / ' + v.target + '</b> · ' + (prediction.patterns.map(esc).join(', ') || '일치 패턴 없음') +
      [...prediction.warnings,...prediction.damage].map(s=>'<p class="warning">' + esc(s) + '</p>').join('') + '</div>' : '';
    return head('주사위 선택','dice',quiet('남은 주사위 ' + v.remaining.length + '개')) + '<div class="tray"><div class="dice-row">' + dice + '</div><div class="consumed">제출한 주사위 ' + (spent(v.submitted) || '없음') + (v.removed.length ? ' · 평가로 제외 ' + spent(v.removed) : '') + '</div>' + mobilePrediction + '<div class="action-line">' +
      btn('submit','선택 제출' + (chosen.size ? ' · ' + chosen.size + '개' : ''),'primary',!chosen.size || !!auto) +
      btn('reroll',icon('replay') + '리롤 · ' + v.rerollsLeft,'',!chosen.size || !v.rerollsLeft || !!auto) +
      btn(auto ? 'stop' : 'auto-view',auto ? '자동 멈춤' : '자동 플레이','',false) +
      '<button class="text-btn" data-action="end"' + (auto ? ' disabled' : '') + '>조기 종료</button></div></div>';
  }
  function offers(source, list) {
    return list.map((id,index) => itemCard(id,source + '-' + index,source === 'stock' && id ? C.RELICS[id].price + '원' : '',source === 'stock' && id && game.money < C.RELICS[id].price)).join('');
  }
  function controls() {
    let html;
    if (game.phase === 'intro') {
      html = head('시작 유물','museum',quiet('소장품 2점')) + '<div class="starter-cards">' + Object.entries(game.board.relics).map(([pos,r])=>itemCard(r.id,'inspect-' + pos)).join('') + '</div><p class="intro-note rules-copy">안내원으로 합을 모으고, 같은 눈 둘을 조명에 제출해 배율을 올리세요. 관람이 끝나면 합 × (1 + 배율)이 감동이 됩니다.</p>';
    } else if (game.phase === 'viewing') { html = diceTray(); }
    else if (game.phase === 'shop') {
      html = head('유물 상점','bag',quiet('잔액 ' + game.money + '원')) + '<div class="offers">' + offers('stock',game.shop.stock) + '</div><div class="panel-body"><div class="inline-actions">' + btn('cell','칸 구매 · ' + G.cellPrice(game) + '원','green',game.money < G.cellPrice(game)) + '</div><p class="button-note">유물을 선택한 뒤 배치할 칸을 누르세요. 판 위의 유물을 누르면 이동하거나 판매할 수 있습니다.</p></div>';
    } else {
      html = head('관람 기록','list',quiet(game.history.length + '명')) + '<div class="panel-body">' + game.history.map(r=>'<div class="result-row"><span>' + r.week + '주 · ' + (r.visitor === C.CONFIG.visitorsPerWeek ? '평가 담당자' : '관객 ' + r.visitor) + '</span><b>감동 ' + r.score + ' / ' + r.target + '</b></div>').join('') + '</div>';
    }
    $('controls').innerHTML = html;
  }
  function scorePanel() {
    const v = game.view, end = game.phase !== 'viewing', p = G.projected(game);
    const score = p.score, target = v.target;
    return '<section class="panel score-panel">' + head(end ? '관람 결과' : '현재 예상 감동','pulse',quiet('관객 기준 ' + target)) +
      '<div class="score-main"><div class="score-number"><b>' + score + '</b><span>/ ' + target + '</span></div><div class="progress"><i style="width:' + Math.min(100, 100*score/target) + '%"></i></div><div class="score-breakdown"><span>합 <b>' + v.sum + '</b></span><span>배율 <b>+' + v.mult + '</b></span><span>종료 토큰 합 <b>+' + p.tokenSum + '</b></span></div></div></section>';
  }
  const changes = new Set(['fire','create','destroy','transform','vanish','removeRelic','changeFace','grantDie','gainReroll']);
  function previewPanel() {
    let body = '<p class="muted">남은 주사위를 누르면 이번 제출로 발동할 유물과 감동을 볼 수 있습니다.</p>';
    if (prediction) {
      const items = prediction.trace.filter(e => changes.has(e.type));
      body = '<div class="result-row"><span>제출 후 예상 감동</span><b class="preview-score">' + prediction.score + '</b></div><p class="muted">일치 패턴 · ' + (prediction.patterns.map(esc).join(', ') || '없음') + '</p>' +
        (items.length ? '<ol class="preview-list">' + items.map(ev=>'<li>' + esc(ev.text) + (ev.pos ? ' ' + point(ev.pos) : '') + '</li>').join('') + '</ol>' : '<p class="muted">발동하는 유물이 없습니다.</p>') +
        prediction.warnings.map(s=>'<p class="warning">' + esc(s) + '</p>').join('');
    }
    return panel(head('제출 미리보기','dice',quiet('선택 ' + chosen.size + '개')) + '<div class="preview-body">' + body + '</div>');
  }
  function bossPanel() {
    const v = game.view, b = v.boss, score = prediction?.score ?? G.projected(game).score;
    return panel(head(b.name + ' 평가','flag',quiet(b.strength + ' 단계')) + '<div class="boss-note"><strong>' + (score >= v.target ? '기준 통과' : '기준 미달') + (game.phase === 'viewing' ? ' 예상' : '') + '</strong>' + esc(b.rule) + (v.sealedFace ? ' 봉인된 눈 ' + v.sealedFace + '.' : '') + '</div><div class="panel-body"><p class="rules-copy">입은 피해 · ' + (v.damage.map(esc).join(' / ') || '없음') + '</p>' + (prediction ? '<p class="rules-copy">이번 제출의 피해 · ' + (prediction.damage.map(esc).join(' / ') || '없음') + '</p>' : '') + '</div>');
  }
  function sidebar() {
    const phase = game.phase, v = game.view;
    if (phase === 'intro') {
      $('sidebar').innerHTML = inventory() + panel(head('주간 평가 일정','calendar',quiet('전 8주')) + schedule());
      return;
    }
    let html = scorePanel();
    if (phase === 'viewing') html += previewPanel();
    if (v.boss) html += bossPanel();
    if (phase !== 'viewing') {
      const r = game.lastResult;
      html += panel(head('관객 정산','coins',quiet(r.grade)) + '<div class="panel-body"><div class="result-row"><span>받은 팁</span><b>+' + r.tip + '원</b></div></div>');
    }
    if (phase === 'viewing' || phase === 'shop') {
      const active = phase === 'shop';
      const cards = !active ? v.rewards.map(id=>itemCard(id,'catalog-' + id)).join('') : (game.shop.rewardDone ? '<p class="rules-copy">이번 관람의 보상 선택을 마쳤습니다.</p>' : offers('reward',v.rewards));
      html += panel(head(active ? '무료 유물 선택' : '관람 후 보상','bag',quiet('3택1')) + '<div class="offers">' + cards +
        (active && !game.shop.rewardDone ? btn('decline','보상 거절','small') : '') + '</div>');
    }
    $('sidebar').innerHTML = html + (phase === 'viewing' ? '' : inventory());
  }
  function report() {
    const el = $('report');
    el.hidden = !lastTrace.length;
    if (!lastTrace.length) return;
    const open = !!el.querySelector('details[open]');
    el.innerHTML = head('처리 기록','list',animation ? btn('skip','연출 건너뛰기','small') : '') +
      (animation ? '<div class="trace-line">' + esc(animation.current) + '</div>' : '') +
      '<div class="report-body"><details' + (open ? ' open' : '') + '><summary>최근 행동 전체 보기 · ' + lastTrace.length + '건</summary><ol class="log-list">' + lastTrace.map(e=>'<li>' + esc(e.text) + (e.pos ? ' ' + point(e.pos) : '') + '</li>').join('') + '</ol></details></div>';
  }
  function render() {
    prediction = chosen.size && game.phase === 'viewing' ? G.preview(game,[...chosen]) : null;
    renderHeadline(); controls(); sidebar(); renderBoard(); report();

  }
  function stopAnimation() {
    clearTimeout(animationTimer);

  }
  function animate(trace, before) {
    stopAnimation();

    let cursor = 0;
    function tick() {
      if (!animation) return;

      const b = animation.board;
      if (e.type === 'create' || e.type === 'transform') b.tokens[e.pos] = e.id;
      if (e.type === 'destroy' || e.type === 'vanish') delete b.tokens[e.pos];
      if (e.type === 'removeRelic') delete b.relics[e.pos];
      animation.pos = e.pos;
      animation.current = cursor + ' / ' + frames.length + ' · ' + e.text + (e.pos ? ' ' + point(e.pos) : '');
      renderBoard(); report(); MuseumSymbols.render($('report'));
      animationTimer = setTimeout(tick, auto ? 65 : 210);
    }
    tick();
  }
  function stopAuto() { clearTimeout(autoTimer); auto = ''; }
  function clearInteraction() { chosen.clear(); focus = null; held = null; }
  function nextVisitor() {
    stopAnimation(); clearInteraction();
    if (G.startViewing(game)) { lastTrace = []; save(); render(); }
  }
  function viewingAction(type, ids) {
    const before = structuredClone(game.board);
    const trace = type === 'submit' ? G.submit(game,ids) : type === 'reroll' ? G.reroll(game,ids) : G.endViewing(game);
    if (!trace.length) return;

    if (terminal() || (game.phase !== 'viewing' && auto === 'view')) stopAuto();
    save(); animate(trace,before); render();
  }
  function autoStep() {
    if (!auto) return;
    if (animation) { autoTimer = setTimeout(autoStep,100); return; }
    if (game.phase === 'viewing') {
      const a = P.chooseAction(game);
      viewingAction(a.type,a.ids);
    } else if (auto === 'run' && !terminal()) {
      clearInteraction(); lastTrace = []; P.step(game); save(); render();
    } else { stopAuto(); render(); return; }
    if (auto) autoTimer = setTimeout(autoStep,350);
  }
  function startAuto(mode) {
    stopAuto(); stopAnimation(); clearInteraction(); auto = mode;
    render(); autoTimer = setTimeout(autoStep,160);
  }
  function selectOffer(action, refresh = true) {
    const [source,i] = action.split('-'), index = Number(i);
    if (game.phase !== 'shop' || auto) return;
    const id = source === 'stock' ? game.shop.stock[index] : game.view.rewards[index];
    if (!id || (source === 'stock' ? game.money < C.RELICS[id].price : game.shop.rewardDone)) return;
    stopAnimation();
    held = {id,source,index,action,facing:0};
    focus = game.board.cells.find(k=>!game.board.relics[k] && !game.board.tokens[k]) || focus;
    if (refresh) {
      render(); B.aim(focus || '0,0');
    } else renderBoard();
  }
  function pickMove(pos) {
    if (game.phase !== 'shop' || auto) return;
    const item = game.board.relics[pos];
    if (!item) return;
    stopAnimation(); focus = pos; held = {id:item.id,source:'move',from:pos,facing:item.facing}; render(); B.aim(pos);
  }
  function boardSelect(pos) {
    if (auto) return;
    stopAnimation();
    focus = pos;
    if (held && game.phase === 'shop') {
      let ok;
      if (held.source === 'cell') ok = G.buyCell(game,pos);
      else if (held.source === 'move') ok = G.moveRelic(game,held.from,pos,held.facing);
      else ok = G.acquire(game,held.source,held.index,pos,held.facing);
      if (ok) { held = null; save(); }
      else say(held.source === 'cell' ? '미구매 자리와 잔액을 확인하세요.' : '유물이나 토큰이 없는 구매한 칸을 선택하세요.');
    }
    render();
  }
  B.connect({select:boardSelect, pick:pickMove, focus(pos) { focus = pos; renderBoard(); }});
  function help() {
    const html = '<div class="dialog-copy"><h3>관람</h3><p>주사위 하나를 골라 제출하면 안내원이 그 눈만큼 합을 올립니다. 같은 눈 둘을 함께 내면 조명이 배율을 1 올립니다. 한 번 제출한 주사위는 다음 관객에게 돌아옵니다.</p><h3>감동과 평가</h3><p>감동은 최종 합 × (1 + 배율)입니다. 현재 예상 감동에는 관람 종료 때 사라질 토큰의 효과도 들어갑니다. 매주 세 번째 관객의 기준을 넘기거나 같으면 다음 주로 넘어갑니다.</p><h3>판과 상점</h3><p>유물을 눌러 발동 조건과 대상 자리를 확인하세요. 빈 곳을 끌어 판을 이동하고 +, −로 확대하거나 축소합니다. 상점에서 유물을 고른 뒤 구매한 빈칸에 놓으세요. 방향 유물은 R로 회전하고 Esc로 배치를 취소합니다.</p><h3>자동 플레이</h3><p>관람 중 자동 플레이는 현재 관객까지 진행합니다. 런 자동 진행은 상점 선택도 맡아 평가 종료까지 이어집니다. 진행 중 멈출 수 있습니다.</p></div>';
    dialog('이용 안내',html);
  }
  function onAction(action) {
    if (action === 'close') { $('dialog').close(); return; }
    if (action === 'help' || action === 'schedule') {
      if (auto) { stopAuto(); render(); }
      if (action === 'help') help(); else dialog('주간 평가 일정',schedule()); return;
    }
    if (action === 'new') {
      if (auto) { stopAuto(); render(); }
      dialog('새 전시 시작','<div class="dialog-copy"><p>새 일정으로 시작하면 이 브라우저에 저장된 현재 런을 교체합니다.</p><div class="inline-actions">' + btn('close','돌아가기') + btn('reset','새 전시 시작','primary') + '</div></div>'); return;
    }
    if (action === 'reset') {
      $('dialog').close(); stopAuto(); stopAnimation(); clearInteraction(); game = G.newGame();
      lastTrace = []; save(); render(); B.fit(); return;
    }
    if (action === 'stop') { stopAuto(); say('자동 진행을 멈췄습니다.'); render(); return; }
    if (action === 'skip') { stopAnimation(); render(); return; }
    if (action === 'zoomin' || action === 'zoomout') { B.zoom(action === 'zoomin' ? 1.25 : 0.8); return; }
    if (action === 'fit') { B.fit(); return; }
    if (auto) return;
    if (action === 'auto-view' || action === 'auto-run') { startAuto(action === 'auto-view' ? 'view' : 'run'); return; }
    if (action === 'start') { nextVisitor(); return; }
    if (action.startsWith('die-')) {
      stopAnimation();
      const id = Number(action.slice(4)); chosen.has(id) ? chosen.delete(id) : chosen.add(id);
      render(); document.querySelector('[data-action="' + action + '"]')?.focus({preventScroll:true}); return;
    }
    if (['submit','reroll','end'].includes(action)) { viewingAction(action,[...chosen]); return; }
    if (action.startsWith('inspect-')) { boardSelect(action.slice(8)); return; }
    if (action.startsWith('catalog-')) {
      const r = C.RELICS[action.slice(8)];
      dialog(r.name,'<div class="dialog-copy"><p>' + r.description + '</p><p class="muted">이번 관람 뒤 상점에서 무료로 선택할 수 있습니다.</p></div>'); return;
    }
    if (action.startsWith('stock-') || action.startsWith('reward-')) { selectOffer(action); return; }
    if (action === 'cancel') { held = null; focus = null; render(); return; }
    if (game.phase !== 'shop') return;
    stopAnimation();
    if (action === 'cell') {
      held = {source:'cell'};
      if (!focus || game.board.cells.includes(focus)) {
        focus = game.board.cells.flatMap(p => C.targets(game.board,p,'adjacent')).find(p => !game.board.cells.includes(p));
      }
      render(); B.aim(focus || '0,0'); return;
    }
    else if (action === 'buy-here') { G.buyCell(game,focus); }
    else if (action === 'decline') { G.declineReward(game); if (held?.source === 'reward') held = null; }
    else if (action === 'move') { pickMove(focus); return; }
    else if (action === 'rotate') {
      if (held && C.RELICS[held.id]?.facing) held.facing = (held.facing+1)%4;
      else if (!held && focus) G.rotateRelic(game,focus);
    }
    else if (action === 'sell') { G.sellRelic(game,focus); }
    save(); render();
  }
  document.addEventListener('click', e => {
    const button = e.target.closest('[data-action]');
    if (button && !button.disabled) onAction(button.dataset.action);
  });
  document.addEventListener('dragstart', e => {
    const card = e.target.closest('.item-card[draggable=true]');
    if (card) {
      e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain',card.dataset.action);
      selectOffer(card.dataset.action,false);
    }
  });
  document.addEventListener('keydown', e => {
    if ($('dialog').open || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') { if (auto) onAction('stop'); else onAction('cancel'); }
    if (e.key.toLowerCase() === 'r' && game.phase === 'shop') onAction('rotate');
  });
  $('dialog').addEventListener('click', e => { if (e.target === $('dialog')) $('dialog').close(); });
  save(); render();
})();

</script>
</body>
</html>
